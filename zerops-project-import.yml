project:
  name: ShipMate2
services:
- hostname: api
  type: python@3.12
  enableSubdomainAccess: true
- hostname: web
  type: static
  enableSubdomainAccess: true
- hostname: worker
  type: python@3.12
- hostname: db
  type: postgresql@16
  mode: NON_HA
- hostname: cache
  type: valkey@7.2
  mode: NON_HA
