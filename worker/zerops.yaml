# ShipMate worker — Zerops build/run config.
# Push from THIS directory (cd worker && zcli push worker). No public ports:
# it runs on the private network. Python deps install at runtime-prepare.
zerops:
  - setup: worker
    build:
      base: python@3.12
      os: ubuntu
      deployFiles: ./
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      os: ubuntu
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y git
        - python3 -m pip install --ignore-installed -r requirements.txt
      start: python worker.py
      envVariables:
        CACHE_HOST: cache
        # AZURE_OPENAI_* come from GUI secrets automatically — do NOT map them
        # here: `VAR: ${VAR}` is a circular reference that overrides the secret
        # with the literal placeholder string.
        CACHE_PORT: "6379"
