# ShipMate worker — Zerops build/run config.
# Push from THIS directory (cd worker && zcli push worker). No public ports:
# it runs on the private network. Python deps install at runtime-prepare.
zerops:
  - setup: worker
    build:
      base: python@3.12
      os: ubuntu
      deployFiles: ./
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      os: ubuntu
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y git
        - python3 -m pip install --ignore-installed -r requirements.txt
      start: python worker.py
      envVariables:
        CACHE_HOST: cache
        CACHE_PORT: "6379"
        AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
        AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
        AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
