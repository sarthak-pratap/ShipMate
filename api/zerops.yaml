# ShipMate API — Zerops build/run config.
# Push from THIS directory (cd api && zcli push api) so requirements.txt is at
# the source root. Python deps install at runtime-prepare (official Zerops
# pattern) — a build-container pip install never reaches the runtime container.
zerops:
  - setup: api
    build:
      base: python@3.12
      os: ubuntu
      deployFiles: ./
      addToRunPrepare:
        - requirements.txt
    run:
      base: python@3.12
      os: ubuntu
      prepareCommands:
        - python3 -m pip install --ignore-installed -r requirements.txt
      ports:
        - port: 8000
          httpSupport: true
      start: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
      envVariables:
        DB_HOST: db
        DB_PORT: "5432"
        DB_NAME: shipmate
        DB_USER: shipmate
        CACHE_HOST: cache
        # AZURE_OPENAI_* come from GUI secrets automatically — do NOT map them
        # here: `VAR: ${VAR}` is a circular reference that overrides the secret
        # with the literal placeholder string.
