# ShipMate web (React + Vite) — Zerops build/run config.
# Built to static assets and served from the `static` service type.
zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      # Vite outputs to dist/ — ship only that
      deployFiles: dist/~
      cache: node_modules
    run:
      base: static
